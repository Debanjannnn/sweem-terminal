name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: publisher, file: go.Dockerfile, svc: publisher}
          - {name: market-data, file: go.Dockerfile, svc: market-data}
          - {name: api, file: go.Dockerfile, svc: api}
          - {name: scheduler, file: go.Dockerfile, svc: scheduler}
          - {name: history, file: go.Dockerfile, svc: history}
          - {name: executor, file: services/executor/Dockerfile}
          - {name: indexer, file: services/indexer/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: SVC=${{ matrix.svc }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sweem-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/sweem-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

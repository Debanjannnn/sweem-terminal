[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
no_match_path = "test/spikes/**"  # retired testnet spikes; live testnet state drifts
fs_permissions = [{ access = "read", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 96
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
monadt = "https://testnet-rpc.monad.xyz"  # test/spikes/perpl

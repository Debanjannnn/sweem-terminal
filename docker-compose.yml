name: sweem-terminal

# chain + venue config every chain-aware service needs
x-chain-env: &chain-env
  CHAIN_ID: ${CHAIN_ID:-10143}
  MONAD_RPC_URL_143: ${MONAD_RPC_URL_143:-https://rpc.monad.xyz}
  MONAD_RPC_URL_10143: ${MONAD_RPC_URL_10143:-https://testnet-rpc.monad.xyz}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-go-build: &go-build
  build:
    context: .
    dockerfile: Dockerfile.golang

x-health: &health
  interval: 10s
  timeout: 3s
  retries: 10
  start_period: 15s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sweem
      POSTGRES_PASSWORD: sweem
      POSTGRES_DB: sweem
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweem"]
      <<: *health
    networks: [backend]

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health
    networks: [backend]

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      <<: *health
    networks: [backend]

  # applies every services/*/migrations/*.sql in filename order, then exits
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: sweem
    volumes: ["./services:/services:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in $$(ls /services/*/migrations/*.sql | sort); do
          echo "applying $$f"
          psql -h postgres -U sweem -d sweem -v ON_ERROR_STOP=1 -f "$$f"
        done
    networks: [backend]



  wallet:
    build:
      context: .
      dockerfile: Dockerfile.golang
      args: {CMD_PATH: services/wallet/cmd/api}
    environment:
      <<: *chain-env
      DATABASE_URL: postgres://sweem:sweem@postgres:5432/sweem?sslmode=disable
      NATS_URL: nats://nats:4222
      EXECUTOR_URL: http://executor:8083
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # deliberately NOT given PRIVY_APP_SECRET — wallet refuses to boot with it
      PRIVY_APP_ID: ${PRIVY_APP_ID:?set PRIVY_APP_ID}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      <<: *health
    networks: [edge, backend]

  # NO host port, ever. the only process that signs.
  executor:
    build:
      context: ./executor
    env_file: [.env.executor]
    environment:
      <<: *chain-env
      EXECUTOR_PORT: 8083
    expose: ["8083"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      <<: *health
    networks: [backend]


# client runs outside compose on purpose: NEXT_PUBLIC_* bakes at build time,
# so `cd client && bun dev` beats rebuilding an image per change.
# indexer runs outside compose too — `cd indexer && bunx envio dev`.

volumes:
  pgdata:

networks:
  edge:
  backend:

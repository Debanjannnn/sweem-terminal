# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: sweem-indexer
description: >-
  sweem finalized-history indexer. Monad testnet (10143). Indexes only
  finalized blocks, which is why it carries no reorg/rollback machinery.

# block_lag holds this indexer FINALITY_DEPTH blocks behind the head, so every
# block it processes is already final and nothing speculative is ever read.
# There is therefore nothing to roll back; turning this on would be dead code,
# not extra safety.
rollback_on_reorg: false

field_selection:
  transaction_fields:
    - hash

contracts:
  # `envio codegen` validates that these strings PARSE, never that they still
  # describe the deployed contract — a wrong signature changes topic0 and the
  # indexer silently matches nothing. src/abi-drift.test.ts diffs every line
  # below against ../contracts/src/*.sol, or pinned on-chain topic0 for Kuru.

  # Kuru Spot V2. Every logical event is packed into one of two logs: 100 000
  # blocks of WETH/USDC contain exactly these two topic0s and nothing else.
  # OrderCreated / Trade / OrdersCanceled are V1 and never fire.
  # `accountId` and `executor` are indexed (topic1/topic2) — the Kuru indexing
  # docs' tables omit that. The `bytes` payload is the whole reducer; layouts
  # and the fail-closed checks live in src/kuru-packed.ts.
  # There is no Solidity in this repo for these, so abi-drift.test.ts guards
  # them against on-chain topic0 instead of against source.
  - name: KuruOrderBook
    events:
      - event: "BookUpdatesPacked(uint40 indexed accountId, address indexed executor, bytes32 clientOrderId, bytes packedUpdates)"
      - event: "TradesPacked(uint40 indexed accountId, address indexed executor, bytes32 clientOrderId, uint24 effectiveTakerFeePps, address builder, uint24 builderFeePps, bytes packedTrades)"

  - name: KuruAccountCore
    # AccountCore holds every balance; orderbooks never hold tokens.
    # SpotReserveUpdated is a post-state snapshot of (free, reserved) and is the
    # ONLY balance writer. Deposit / Withdrawal / InternalAccountTransfer are
    # history and are deliberately unbound: applying both double-counts.
    events:
      - event: "AccountRegistered(address indexed account, uint40 indexed accountId, uint40 indexed rootId, address owner, uint16 tier)"
      - event: "SpotReserveUpdated(uint40 indexed accountId, address indexed token, uint256 free, uint256 reserved)"

chains:
  - id: 10143 # Monad testnet. Mainnet (143) is a config swap, not a code change.
    # Kuru AccountCore deployment (58 777 816 … 58 780 715).
    start_block: ${ENVIO_START_BLOCK:-58777816}
    # The env var exists for exactly one reason: the test framework's synthetic
    # block source never advances past the last simulated block, so a non-zero
    # lag hangs the tests forever. `bun run test` sets it to 0. Nothing else may.
    # Production is 5 = FINALITY_DEPTH (STATE_ROOT_LAG 3 + 2).
    block_lag: ${ENVIO_BLOCK_LAG:-5}
    # No block this indexer sees can reorg. Envio's generic 200-block default
    # would only be dead state.
    max_reorg_depth: 0
    # Data source is HyperSync, which REQUIRES ENVIO_API_TOKEN: envio aborts at
    # startup without one and monad-testnet.hypersync.xyz/query answers
    # unauthenticated calls with 401. There is no degraded mode.
    #
    # An `rpc:` block here would fall back to plain RPC when HyperSync is down.
    # It is deliberately absent: one wired path beats two half-wired ones.
    # SETUP.md §1 carries the tested block to paste in, with the eth_getLogs
    # range cap each provider needs.
    contracts:
      - name: KuruAccountCore
        address: "${KURU_ACCOUNT_CORE:-0x6384e9b2Bf3b65e1535403a0A543b5FDA905eE22}"
      # One OrderBook proxy per market. Format is a YAML flow list because this
      # is a textual substitution: KURU_MARKETS=["0x..","0x.."]. A bare comma
      # list fails codegen with "invalid address".
      - name: KuruOrderBook
        address: ${KURU_MARKETS:-["0x5BDEA6F9F9abA34F4EcB9B865646A792b835ef7f","0xa9C2936656a7D2143720BcD91Ba8506200B7CbE7","0xfdbE356828c8f5A5d5ed4f69ddE0816f4058Ef61","0x0B4dD2A7b09d5c5401149fFe51301Cc589017343"]}

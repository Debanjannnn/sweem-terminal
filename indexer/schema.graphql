# SCALE CONTRACT — read before adding a field.
#   every monetary / rate / size field is 18-decimal WAD BigInt.
#   USDC is 6dp at the contract boundary; widened once in src/scale.ts.
#   *RateApr = per-second WAD * 365d, so 1e18 == 100% APR.
#   size and skew are SIGNED WAD, longs positive.
#   kuru price/size/balances are RAW venue units, not WAD — see KuruSlot.
# Everything here is finalized history. Nothing live, nothing speculative.

enum VaultEventKind {
  DEPOSIT
  WITHDRAW
  BORROW_ACCRUAL
  FUNDING_ACCRUAL
  LIQUIDATION_FEE
  TRADING_FEE
  TRADER_PNL
  BAD_DEBT
}

"singleton, id = \"SweemVault\""
type Vault {
  id: ID!
  totalAssets: BigInt!
  totalShares: BigInt!
  "totalAssets * WAD / totalShares. 1e18 at genesis."
  sharePrice: BigInt!

  "these six decompose (totalAssets - cumDeposited + cumWithdrawn), i.e. LP APY"
  cumBorrowIncome: BigInt!
  cumFundingIncome: BigInt!
  cumLiquidationFeeIncome: BigInt!
  cumTradingFeeIncome: BigInt!
  "positive means the vault paid traders, a loss to LPs"
  cumTraderPnlPaid: BigInt!
  "trader losses the vault could not collect"
  cumBadDebt: BigInt!

  cumDeposited: BigInt!
  cumWithdrawn: BigInt!
  lpCount: Int!
  updatedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
}

type LpAccount {
  id: ID!
  vault: Vault!
  shares: BigInt!
  "assets paid in for the shares still held"
  costBasis: BigInt!
  cumDeposited: BigInt!
  cumWithdrawn: BigInt!
  "assetsOut - costBasis consumed, booked on withdrawal"
  realizedPnl: BigInt!
  "shares * Vault.sharePrice - costBasis, revalued on every share-price move"
  unrealizedPnl: BigInt!
  firstDepositTimestamp: BigInt!
  updatedAtTimestamp: BigInt!
  flows: [VaultFlow!]! @derivedFrom(field: "account")
}

type VaultFlow {
  id: ID!
  account: LpAccount!
  kind: VaultEventKind!
  assets: BigInt!
  shares: BigInt!
  sharePrice: BigInt!
  "zero for deposits"
  realizedPnl: BigInt!
  caller: String!
  counterparty: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"id is the on-chain bytes32 marketId. the registry stores no symbol, so neither does this."
type Market {
  id: ID!
  indexOracle: IndexFeed!
  "annualized sigma feed. null disables the power-funding term."
  volOracle: IndexFeed
  "power exponent, signed WAD. 0 plain, 2e18 square."
  k: BigInt!

  maxLeverage: BigInt!
  maxOiPerSide: BigInt!
  minPositionSize: BigInt!
  maintenanceMarginBps: BigInt!
  openFeeBps: BigInt!
  closeFeeBps: BigInt!
  liquidationFeeBps: BigInt!
  skewScale: BigInt!
  fundingK: BigInt!
  fundingCapPerSec: BigInt!
  "governance switch (MarketEnabled)"
  enabled: Boolean!
  "guardian kill switch (MarketHalted)"
  halted: Boolean!

  longOI: BigInt!
  shortOI: BigInt!
  skew: BigInt!

  cumulativeFundingPerNotional: BigInt!
  cumulativeBorrowPerNotional: BigInt!
  lastFundingRate: BigInt!
  lastBorrowRate: BigInt!
  lastUtilization: BigInt!
  lastIndexPrice: BigInt!
  lastMarkPrice: BigInt!

  cumVolume: BigInt!
  cumFees: BigInt!
  cumFundingToVault: BigInt!
  cumBorrowToVault: BigInt!
  tradeCount: Int!
  openPositionCount: Int!
  liquidationCount: Int!

  createdAtTimestamp: BigInt!
  createdAtBlock: BigInt!
  updatedAtTimestamp: BigInt!

  positions: [Position!]! @derivedFrom(field: "market")
  fundingPoints: [FundingRatePoint!]! @derivedFrom(field: "market")
  borrowPoints: [BorrowRatePoint!]! @derivedFrom(field: "market")
  liquidations: [Liquidation!]! @derivedFrom(field: "market")
}

type FundingRatePoint {
  id: ID!
  market: Market!
  timestamp: BigInt!
  blockNumber: BigInt!
  "seconds covered by this accrual"
  dt: BigInt!
  "per-second WAD, positive means longs pay. skew term plus power term, clamped."
  fundingRate: BigInt!
  "k(k-1)/2 * sigma^2 per second. subtract for the pure skew component."
  powerFundingRate: BigInt!
  fundingRateApr: BigInt!
  cumulativeFundingPerNotional: BigInt!
  longOI: BigInt!
  shortOI: BigInt!
  skew: BigInt!
  markPrice: BigInt!
  indexPrice: BigInt!
}

type BorrowRatePoint {
  id: ID!
  market: Market!
  timestamp: BigInt!
  blockNumber: BigInt!
  dt: BigInt!
  borrowRate: BigInt!
  borrowRateApr: BigInt!
  cumulativeBorrowPerNotional: BigInt!
  utilization: BigInt!
}

enum PositionAction {
  OPEN
  MODIFY
  CLOSE
  LIQUIDATE
}

type Trader {
  id: ID!
  realizedPnl: BigInt!
  cumVolume: BigInt!
  cumFeesPaid: BigInt!
  cumBorrowPaid: BigInt!
  cumFundingPaid: BigInt!
  tradeCount: Int!
  liquidationCount: Int!
  openPositionCount: Int!
  firstTradeTimestamp: BigInt!
  updatedAtTimestamp: BigInt!
  positions: [Position!]! @derivedFrom(field: "trader")
}

"one row per (market, trader). closed positions are kept, not deleted."
type Position {
  id: ID!
  market: Market!
  trader: Trader!
  "signed WAD, zero once closed"
  size: BigInt!
  collateral: BigInt!
  entryIndex: BigInt!
  notional: BigInt!
  isOpen: Boolean!
  liquidated: Boolean!

  realizedPnl: BigInt!
  borrowPaid: BigInt!
  fundingPaid: BigInt!
  feesPaid: BigInt!
  badDebt: BigInt!

  openedAtTimestamp: BigInt!
  openedAtBlock: BigInt!
  closedAtTimestamp: BigInt
  closedAtBlock: BigInt

  events: [PositionEvent!]! @derivedFrom(field: "position")
}

"append-only position history"
type PositionEvent {
  id: ID!
  position: Position!
  market: Market!
  trader: Trader!
  action: PositionAction!

  sizeDelta: BigInt!
  collateralDelta: BigInt!
  sizeAfter: BigInt!
  collateralAfter: BigInt!
  indexPrice: BigInt!
  notional: BigInt!
  "this action only, not cumulative"
  realizedPnl: BigInt!
  borrowPaid: BigInt!
  fundingPaid: BigInt!
  fee: BigInt!

  timestamp: BigInt!
  blockNumber: BigInt!
  logIndex: Int!
  txHash: String!
}

type Liquidation {
  id: ID!
  position: Position!
  market: Market!
  trader: Trader!
  liquidator: String!
  size: BigInt!
  indexPrice: BigInt!
  notional: BigInt!
  penalty: BigInt!
  liquidatorReward: BigInt!
  "penalty - liquidatorReward, feeds cumLiquidationFeeIncome"
  vaultFee: BigInt!
  "collateral returned to the trader, WAD (the contract emits 6dp)"
  traderRefund: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"one IndexOracle contract. id is its address."
type IndexFeed {
  id: ID!
  latestValue: BigInt!
  latestRoundId: BigInt!
  "oracle-reported observation time of the latest accepted value"
  latestTimestamp: BigInt!
  "true while the deviation breaker is tripped and the feed refuses reads"
  halted: Boolean!
  publicationCount: Int!
  breakerTripCount: Int!
  publications: [IndexPublication!]! @derivedFrom(field: "feed")
  breakerEvents: [OracleBreakerEvent!]! @derivedFrom(field: "feed")
}

type IndexPublication {
  id: ID!
  feed: IndexFeed!
  roundId: BigInt!
  value: BigInt!
  writer: String!
  "oracle-reported observation time, not block time"
  publishedAt: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

enum BreakerAction {
  TRIPPED
  RESET
}

type OracleBreakerEvent {
  id: ID!
  feed: IndexFeed!
  action: BreakerAction!
  roundId: BigInt!
  lastValue: BigInt!
  "value that breached max deviation (TRIPPED) or the reseed value (RESET)"
  newValue: BigInt!
  deviationBps: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"singleton, id = \"Sweem\""
type Protocol {
  id: ID!
  tvl: BigInt!
  sharePrice: BigInt!
  openInterestLong: BigInt!
  openInterestShort: BigInt!
  "total open notional / TVL, WAD"
  utilization: BigInt!
  cumVolume: BigInt!
  cumFees: BigInt!
  cumLiquidationVolume: BigInt!
  cumBadDebt: BigInt!
  tradeCount: Int!
  liquidationCount: Int!
  lpCount: Int!
  traderCount: Int!
  marketCount: Int!
  updatedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
}

# kuru spot v2. two packed logs carry everything: BookUpdatesPacked is maker-slot
# state, TradesPacked is fills. OrderCreated/Trade/OrdersCanceled do not exist on
# v2 and never fired.
#
# canonical order is (blockNumber, logIndex, recordIdx). logIndex is block-scoped
# so it already subsumes transactionIndex; recordIdx is the ordinal of the record
# inside the packed payload, because several fills share one log.
#
# price/size stay in the market's own tick units. pricePrecision, sizePrecision
# and baseSizeMultiplier appear in NO event, so rawBaseAtoms = size *
# baseSizeMultiplier is the consumer's call — scaling a value we cannot verify
# would be worse than storing it unscaled.

"a live maker slot. id = <market>-<userId>-<slotIdx>. 62 slots per account, reused, so the row is deleted when the slot empties; history lives in KuruFill."
type KuruSlot {
  id: ID!
  "orderbook address, one proxy per market"
  market: String!
  "AccountCore id of the maker"
  userId: BigInt!
  slotIdx: Int!
  "changes on every replace; a slot id is not an order id"
  orderId: BigInt!
  "raw uint32 tick, displayPrice = price / pricePrecision"
  price: BigInt!
  "resting size in sizePrecision units"
  size: BigInt!
  isBuy: Boolean!
  """
  RAB threshold block, 0 disables. no event fires at threshold+1 and no storage
  changes, so executable depth past it is min(size, minNotionalSizeAtPrice) and
  must be derived at read time — this column is the stored book, not that.
  """
  minSizeAfterBlock: BigInt!
  makerFeePps: Int!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"one maker-leg fill. id = <market>-<tradeId>-<recordIdx>, the venue's stable fill identity."
type KuruFill {
  id: ID!
  market: String!
  tradeId: BigInt!
  "ordinal inside the packed payload"
  recordIdx: Int!
  "AccountCore id of the taker (topic1)"
  takerId: BigInt!
  "submitter; a delegated signer, not necessarily the account address"
  executor: String!
  "AccountCore id of the maker. 0 on a passive-band fill."
  makerId: BigInt!
  slotIdx: Int!
  "on a passive fill this carries the band lowPrice, not an order id"
  orderId: BigInt!
  "true when the resting maker order was a bid, i.e. the taker sold"
  makerIsBuy: Boolean!
  "filled against a passive band rather than an active FIFO slot"
  passive: Boolean!
  "last leg of this taker match"
  matchEnd: Boolean!
  price: BigInt!
  filledSize: BigInt!
  "maker size remaining after the fill. the book moves by (oldSize - updatedSize), which is not always filledSize."
  updatedSize: BigInt!
  "fee = amount * pps / 10_000_000"
  makerFeePps: Int!
  takerFeePps: Int!
  clientOrderId: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  logIndex: Int!
  txHash: String!
}

"id = the uint40 AccountCore id"
type KuruAccount {
  id: ID!
  address: String!
  "equals id for a root account"
  rootId: BigInt!
  createdAtBlock: BigInt!
  balances: [KuruBalance!]! @derivedFrom(field: "account")
}

"""
id = <accountId>-<token>. SpotReserveUpdated is the sole writer: it is an
authoritative post-state snapshot, so it overwrites. Deposit / Withdrawal /
InternalAccountTransfer are history only and are deliberately not indexed —
applying both would double-count.
"""
type KuruBalance {
  id: ID!
  account: KuruAccount!
  "address(0) is native MON"
  token: String!
  "raw token atoms, not WAD"
  free: BigInt!
  "reserved across ALL verified spot markets; AccountCore does not attribute it per market"
  reserved: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

# make deploy (= ansible-playbook -i "<ip>," site.yml)
# pulls the GHCR images CI built (.github/workflows/images.yml), ships compose files + env, restarts the stack.
# GHCR_TOKEN (classic PAT, read:packages) comes from .env.ghcr via make.
- hosts: all
  vars:
    app: /opt/sweem
    repo: "{{ (playbook_dir + '/../..') | realpath }}"
    compose: docker compose -f docker-compose.yml -f docker-compose.prod.yml
  tasks:
    - name: Swap
      shell: |
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args: {creates: /swapfile}

    - name: SSH keys only
      lineinfile: {path: /etc/ssh/sshd_config, regexp: '^#?PasswordAuthentication', line: PasswordAuthentication no}
      notify: restart ssh

    - name: Docker, security upgrades
      apt: {name: [docker.io, docker-compose-v2, unattended-upgrades], update_cache: true}

    - name: GHCR login
      shell: docker login ghcr.io -u snehendu098 --password-stdin
      args: {stdin: "{{ lookup('env', 'GHCR_TOKEN') }}"}
      no_log: true
      changed_when: false

    - name: Dirs
      file: {path: "{{ app }}/infra", state: directory}

    # dirs without a trailing slash copy as themselves; migrations are append-only, so no delete needed
    # images carry the binaries + deployments; compose, migrations (mounted into migrate) and the Caddyfile live here
    - name: Compose files, migrations, Caddyfile
      copy: {src: "{{ repo }}/{{ item }}", dest: "{{ app }}/{{ item | dirname }}/"}
      loop: [docker-compose.yml, docker-compose.prod.yml, migrations, infra/Caddyfile]

    - name: Env files
      copy: {src: "{{ repo }}/{{ item }}", dest: "{{ app }}/{{ item }}", mode: "0600"}
      loop: [.env, .env.api, .env.executor]

    - name: Pull
      command: "{{ compose }} pull"
      args: {chdir: "{{ app }}"}
      changed_when: true

    - name: Start
      command: "{{ compose }} up -d --no-build --remove-orphans"
      args: {chdir: "{{ app }}"}
      changed_when: true

    - name: Drop old images
      command: docker image prune -f
      changed_when: false

  handlers:
    - name: restart ssh
      service: {name: ssh, state: restarted}

version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sweem-terminal/sweem-terminal/internal/shared/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: internal/shared/gen
    opt: paths=source_relative
  - remote: buf.build/community/neoeinstein-prost:v0.4.1
    out: executor/src/gen
  - remote: buf.build/community/neoeinstein-prost-serde:v0.3.1
    out: executor/src/gen
  - remote: buf.build/community/stephenh-ts-proto:v2.7.0
    out: client/src/gen
    opt:
      - esModuleInterop=true
      - useExactTypes=false
  - remote: buf.build/community/stephenh-ts-proto:v2.7.0
    out: oracle/src/gen
    opt:
      - esModuleInterop=true
      - useExactTypes=false

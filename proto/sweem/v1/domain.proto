syntax = "proto3";

package sweem.v1;

// all monetary and size values are decimal strings, uint256-safe

enum Venue {
  VENUE_UNSPECIFIED = 0;
  VENUE_KURU = 1;
  VENUE_PERPL = 2;
  VENUE_SWEEM = 3; // our IndexPerpEngine markets
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum ScheduleKind {
  SCHEDULE_KIND_UNSPECIFIED = 0;
  SCHEDULE_KIND_TWAP = 1;
  SCHEDULE_KIND_DCA = 2;
  SCHEDULE_KIND_GRID = 3;
}

// monad confirmation tiers: latest / safe / finalized
enum Confirmation {
  CONFIRMATION_UNSPECIFIED = 0;
  CONFIRMATION_SEEN = 1; // latest, proposed
  CONFIRMATION_SAFE = 2; // voted
  CONFIRMATION_FINAL = 3; // finalized
}

message Market {
  string id = 1;
  Venue venue = 2;
  string symbol = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  string base_address = 6;
  string quote_address = 7;
  uint32 base_decimals = 8;
  uint32 quote_decimals = 9;
  string price_precision = 10; // per-market scaled integer
  string size_precision = 11; // per-market scaled integer
  string tick_size = 12;
  string min_size = 13;
  int64 chain_id = 14;
}

message Tick {
  string market_id = 1;
  int64 ts_ms = 2;
  string price = 3;
  string size = 4;
  Side side = 5;
}

message BookLevel {
  string price = 1;
  string size = 2;
}

message Book {
  string market_id = 1;
  int64 ts_ms = 2;
  repeated BookLevel bids = 3;
  repeated BookLevel asks = 4;
  uint64 block_number = 5;
}

message Candle {
  string market_id = 1;
  string resolution = 2;
  int64 open_time = 3;
  string open = 4;
  string high = 5;
  string low = 6;
  string close = 7;
  string volume = 8;
}

message Position {
  string id = 1;
  string market_id = 2;
  string owner = 3;
  Side side = 4;
  string size = 5;
  string entry_price = 6;
  string margin = 7;
  string liquidation_price = 8;
  string unrealized_pnl = 9;
  Venue venue = 10;
}

message Intent {
  string intent_key = 1; // idempotency key for the whole execution path
  string market_id = 2;
  Venue venue = 3;
  Side side = 4;
  OrderType order_type = 5;
  string size = 6;
  string limit_price = 7;
  uint32 max_slippage_bps = 8;
  int64 chain_id = 9;
}

message Execution {
  string intent_key = 1;
  string tx_hash = 2;
  Confirmation confirmation = 3;
  string error = 4;
  int64 submitted_at = 5;
}

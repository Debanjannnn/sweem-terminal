[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = "1.7"
alloy-sol-types = { version = "1.7", features = ["json"] }
anyhow = "1"
hypersync-client = "1.4.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
